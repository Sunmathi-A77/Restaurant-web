<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account | Delicious Restaurant</title>
  <link rel="stylesheet" href="signup.css" />
</head>
<body>

  <!-- Background Video -->
  <video autoplay muted loop playsinline class="background-video">
    <source src="video/food-motion.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>

  <!-- Signup Form Container -->
  <div class="login-container">
    <div class="login-box">
      <h2>Create Account</h2>
      <form onsubmit="return signup(event)">
        <input type="email" id="new-email" placeholder="Enter your email" required />
        <input type="password" id="new-password" placeholder="Create password" required />
        <button type="submit">Sign Up</button>
      </form>
      <p class="create-account-link">
        Already have an account? <a href="login.html">Login</a>
      </p>
    </div>
  </div>

  <script src="signup.js"></script>
</body>
</html>
